<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Revisão assistida — Audita Acessibilidade</title>
    <link rel="stylesheet" href="review.css">
    <script type="module" src="review.js"></script>
  </head>
  <body>
    <main>
      <h1>Revisão assistida</h1>
      <p id="review-status" role="status" aria-live="polite" tabindex="-1">Carregando a auditoria.</p>
      <div class="review-controls">
        <label for="review-evaluator">Nome da pessoa avaliadora</label>
        <input id="review-evaluator" autocomplete="name" required>
        <button id="regenerate-report" type="button">Gerar relatório atualizado</button>
        <button id="delete-audit" type="button" class="danger-action" disabled>Excluir auditoria local</button>
        <a href="../panel/index.html">Voltar ao painel</a>
      </div>
      <section id="review-list" aria-label="Ocorrências para revisão"></section>
      <dialog id="delete-audit-dialog" aria-labelledby="delete-audit-title" aria-describedby="delete-audit-description" aria-hidden="true">
        <h2 id="delete-audit-title">Excluir esta auditoria local?</h2>
        <p id="delete-audit-description">Esta ação apaga as evidências, os pixels e as revisões locais desta auditoria. Os downloads já salvos não serão apagados.</p>
        <p id="delete-audit-dialog-status" class="dialog-status" role="status" aria-live="polite" aria-atomic="true"></p>
        <div class="dialog-actions">
          <button id="delete-audit-cancel" type="button">Cancelar</button>
          <button id="delete-audit-confirm" type="button" class="danger-action">Excluir auditoria</button>
        </div>
      </dialog>
    </main>
  </body>
</html>
