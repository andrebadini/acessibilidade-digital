# CI da Audita Acessibilidade
#
# Repositório público: roda em runner hospedado do GitHub (gratuito para repositórios públicos).
# Não usar runner self-hosted aqui — um PR de fork poderia executar código na máquina do mantenedor.
name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: verify-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: Dependências (axe-core para verify/vendor)
        run: npm install --no-audit --no-fund

      - name: Verify (manifest, CSP, axe, identidade neutra)
        run: AUDITA_VERIFY_SKIP_TESTS=1 npm run verify

      - name: Testes lógicos (sem E2E de Chrome)
        run: |
          node --test \
            test/background/*.test.js \
            test/panel/*.test.js \
            test/core/*.test.js \
            test/browser/*.test.js \
            test/privacy/*.test.js \
            test/integration/*.test.js \
            test/storage/*.test.js \
            test/release-package.test.js \
            test/release-assets.test.js

      - name: Conferir pacote de release
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          PKG="release/audita-acessibilidade-${VERSION}.zip"
          test -f "$PKG"
          shasum -a 256 "$PKG"
          unzip -p "$PKG" manifest.json | python3 -c "import sys,json; m=json.load(sys.stdin); assert m['version']=='$VERSION', m; print('manifest', m['version'])"
